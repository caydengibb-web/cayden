# Real Reach Content. A static site: index.html, styles.css, main.js and /assets.
# No build step. Netlify serves the repository root as-is.
[build]
  publish = "."
  command = "echo static site, no build step"

# Old Astro routes. Ads may still point at /call, and Calendly may still redirect to /booked.
[[redirects]]
  from = "/call"
  to = "/#call"
  status = 301

[[redirects]]
  from = "/booked"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://assets.calendly.com; img-src 'self' data: https:; font-src 'self' data:; media-src 'self' blob:; frame-src https://calendly.com https://*.calendly.com; connect-src 'self' https://calendly.com https://*.calendly.com; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

# Media and fonts change rarely. A week of caching keeps replacements visible within a few days.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
